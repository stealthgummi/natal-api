<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AstroOverlay Sample Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0b10;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p {
      color: #94a3b8;
      font-size: 0.9rem;
      max-width: 600px;
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 2rem;
      max-width: 1200px;
      width: 100%;
    }
    .preview-card {
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .canvas-box {
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    /* Background Skin 1: Deep Cosmic Space */
    .bg-nebula {
      background: radial-gradient(circle at 30% 30%, #2e1065 0%, #09090b 70%);
      box-shadow: inset 0 0 50px rgba(168, 85, 247, 0.2);
    }
    /* Background Skin 2: Modern Glass Dark Gradient */
    .bg-aurora {
      background: linear-gradient(135deg, #064e3b 0%, #022c22 40%, #030712 100%);
      box-shadow: inset 0 0 50px rgba(16, 185, 129, 0.2);
    }
    /* Background Skin 3: Midnight Obsidian */
    .bg-obsidian {
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    img.svg-overlay {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #00f0ff;
      color: #000;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
      margin-top: 1rem;
      transition: transform 0.15s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <h1>✦ The Architect's Brand Overlay</h1>
  <p>Your official birth chart (March 2, 1971 · Cincinnati, OH) as the permanent reference overlay, dropped over 3 custom skins:</p>

  <div class="grid">
    <!-- Skin 1 -->
    <div class="preview-card" style="background: rgba(255, 255, 255, 0.02);">
      <div class="card-title" style="color: #c084fc;">Skin 1: Deep Nebula</div>
      <div class="canvas-box bg-nebula">
        <img class="svg-overlay" src="./overlay_sample.svg" alt="Astro Overlay">
      </div>
    </div>

    <!-- Skin 2 -->
    <div class="preview-card" style="background: rgba(255, 255, 255, 0.02);">
      <div class="card-title" style="color: #34d399;">Skin 2: Emerald Aurora</div>
      <div class="canvas-box bg-aurora">
        <img class="svg-overlay" src="./overlay_sample.svg" alt="Astro Overlay">
      </div>
    </div>

    <!-- Skin 3 -->
    <div class="preview-card" style="background: rgba(255, 255, 255, 0.02);">
      <div class="card-title" style="color: #94a3b8;">Skin 3: Pure Obsidian OLED</div>
      <div class="canvas-box bg-obsidian">
        <img class="svg-overlay" src="./overlay_sample.svg" alt="Astro Overlay">
      </div>
    </div>
  </div>

  <a class="btn" href="./overlay_sample.svg" download="overlay_sample.svg">
    ⬇ Download Raw overlay_sample.svg
  </a>

</body>
</html>
